# ── Test overrides ───────────────────────────────────────────────────────────
# Use H2 in-memory database instead of PostgreSQL
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ── CRITICAL: Disable Hibernate multi-tenancy injected by base-service ────────
# TenantIdentifierResolver (base-service) sets MULTI_TENANT_IDENTIFIER_RESOLVER
# via HibernatePropertiesCustomizer. Without the matching multiTenancy mode in
# Hibernate 6, the EntityManagerFactory fails to start. Set it to NONE for tests.
spring.jpa.properties.hibernate.multiTenancy=NONE

# Allow @Primary beans in IntegrationTestConfig to override base-service beans
# (e.g. CorsConfig.corsConfigurationSource vs SecurityConfig.corsConfigurationSource)
spring.main.allow-bean-definition-overriding=true

# ── Redis ──────────────────────────────────────────────────────────────────────
# IntegrationTestConfig provides mock RedisConnectionFactory + RedisTemplate beans.
# Exclude Redis auto-configurations so Spring Boot does NOT try to open a real TCP
# connection before the mock beans are in place.
spring.data.redis.repositories.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# ── Scheduling ────────────────────────────────────────────────────────────────
# Disable scheduled tasks (e.g. role expiry cron) so they don't fire during tests
spring.task.scheduling.enabled=false
rbac.expiry.notification-cron=0 0 0 * * *
rbac.expiry.notification-zone=UTC

# ── Bulk / misc settings required by @Value fields ────────────────────────────
rbac.bulk.atomic=true

# JWT secret (required by SecurityConfig @Value — no default)
app.jwt.secret=test-secret-key-for-unit-tests-only

# CORS allowed origins (required by SecurityConfig @Value — no default)
app.cors.allowed-origins=http://localhost:3000

# Suppress server.port binding noise during tests
server.port=0

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
