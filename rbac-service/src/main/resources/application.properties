# Application 
spring.application.name=rbac-service
server.port=8083



# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/rbac-serviceDB
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=root


# JPA / Hibernate 
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false


spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


 
# Multi-Tenancy
app.tenant.default-tenant=default
app.tenant.header-name=X-Tenant-ID


 
# JWT Authentication
app.jwt.secret=your-secret-key-here
app.jwt.expiration-ms=86400000


 
# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


# -------------------- FILE UPLOAD ----------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# -------------------- PART 4 SETTINGS ------------------------
# true  = a validation failure aborts/rolls back the batch
# false = collect per-user failures and save valid assignments
rbac.bulk.atomic=true

# Daily at midnight UTC, as required by the sprint plan.
rbac.expiry.notification-cron=0 0 0 * * *
rbac.expiry.notification-zone=UTC

# Actuator health endpoint
management.endpoints.web.exposure.include=health,info