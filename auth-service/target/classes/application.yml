server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: auth-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/microservice_db}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:wiz@linux}
    hikari:
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:300000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1200000}
      connection-timeout: ${DB_POOL_CONN_TIMEOUT:20000}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: ${SPRING_JPA_DEFAULT_SCHEMA:public}
        jdbc:
          lob:
            non_contextual_creation: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH2_GOOGLE_CLIENT_ID:1086252950567-ihp1548r8omnufav2vndev4ruce215vb.apps.googleusercontent.com}
            client-secret: ${OAUTH2_GOOGLE_CLIENT_SECRET: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}
            scope:
              - email
              - profile
              - openid
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          github:
            client-id: ${OAUTH2_GITHUB_CLIENT_ID:github-client-id-placeholder}
            client-secret: ${OAUTH2_GITHUB_CLIENT_SECRET:github-client-secret-placeholder}
            scope:
              - user:email
              - read:user
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          microsoft:
            client-id: ${OAUTH2_MICROSOFT_CLIENT_ID:977a797d-5a2e-4fb8-a151-b18f85635f22}
            client-secret: ${OAUTH2_MICROSOFT_CLIENT_SECRET:E3H8Q~9YJe9seOv5oCOCaT.6p4dJPHPOZfZ~AbFw}
            scope:
              - openid
              - profile
              - email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          microsoft:
            # Explicit static endpoints instead of issuer-uri: issuer-uri forces Spring Boot
            # to make a LIVE network call at startup to discover these URLs, and Microsoft's
            # multi-tenant /common/ metadata document returns a literal "{tenantid}" placeholder
            # that Spring's strict URI parser rejects, crashing the app before it can even start.
            # Static URLs avoid any startup-time network call entirely.
            # Tenant ID below is the real Directory (tenant) ID from Azure — "common" won't
            # reliably work with this static-endpoint approach for the userinfo call.
            authorization-uri: https://login.microsoftonline.com/${OAUTH2_MICROSOFT_TENANT_ID:1380dd78-5b89-40ee-b046-d89d51024a62}/oauth2/v2.0/authorize
            token-uri: https://login.microsoftonline.com/${OAUTH2_MICROSOFT_TENANT_ID:1380dd78-5b89-40ee-b046-d89d51024a62}/oauth2/v2.0/token
            jwk-set-uri: https://login.microsoftonline.com/${OAUTH2_MICROSOFT_TENANT_ID:1380dd78-5b89-40ee-b046-d89d51024a62}/discovery/v2.0/keys
            user-info-uri: https://graph.microsoft.com/oidc/userinfo
            user-name-attribute: sub

# Application Configuration
app:
  security:
    common-jwt-filter:
      enabled: false
    lockout:
      max-attempts: ${ACCOUNT_LOCKOUT_MAX_ATTEMPTS:3}
      duration-minutes: ${ACCOUNT_LOCKOUT_DURATION_MINUTES:2}
  security-alerts:
    enabled: ${SECURITY_ALERTS_ENABLED:true}
    # Shared secret other services send in the X-Internal-Api-Key header to POST /security-alerts/events/ingest.
    # Empty = that endpoint is disabled. Never commit a real value.
    ingest-api-key: ${SECURITY_ALERTS_INGEST_API_KEY:}
    # Only set to true behind a proxy that overwrites X-Forwarded-For; otherwise clients can fake their IP.
    trust-forwarded-headers: ${SECURITY_ALERTS_TRUST_FORWARDED_HEADERS:false}
    # Maximum rows in one "Export Report" CSV download.
    export-max-rows: ${SECURITY_ALERTS_EXPORT_MAX_ROWS:10000}
  tenant:
    default-tenant: ${DEFAULT_TENANT_ID:default}
    header-name: ${TENANT_HEADER_NAME:X-Tenant-ID}
  jwt:
    # 256-bit+ HMAC-SHA key in Base64 or standard string (minimum 32 characters)
    # IMPORTANT: This secret MUST match the JWT_SECRET in base-service / platform-administration-service.
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}         # 24 hours
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # 7 days
  oauth2:
    # POC: backend-served callback.html. Point this at a real frontend URL in production.
    authorized-redirect-uris: ${APP_OAUTH2_AUTHORIZED_REDIRECT_URIS:http://localhost:8081/api/callback.html,http://localhost:8081/api/auth/oauth2/success}

# Springdoc OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
