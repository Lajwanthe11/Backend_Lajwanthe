# Local review only. This profile creates and drops an isolated memory database.
server:
  address: 127.0.0.1
  port: 8081

spring:
  datasource:
    url: jdbc:h2:mem:company_review_v3;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: false

app:
  jwt:
    # Public demonstration key, valid Base64 for the inherited JWT provider.
    secret: ${JWT_SECRET:YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXphYmNkZWY=}
