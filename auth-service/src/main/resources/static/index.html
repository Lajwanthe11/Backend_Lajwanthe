<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Auth Service — SSO Demo</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; max-width: 720px;
            margin: 60px auto; padding: 0 24px; color: #222; }
        h1 { margin-bottom: 4px; }
        .sub { color: #666; margin-top: 0; }
        .btn { display: inline-flex; align-items: center; gap: 10px;
            padding: 12px 20px; border: 1px solid #dadce0; border-radius: 6px;
            background: #fff; font-size: 15px; cursor: pointer; text-decoration: none;
            color: #222; transition: box-shadow .15s; }
        .btn:hover { box-shadow: 0 1px 6px rgba(0,0,0,.15); }
        .card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 20px;
            margin-top: 20px; background: #fafafa; }
        .kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px;
            margin: 10px 0; }
        .k { color: #666; }
        .v { font-family: ui-monospace, monospace; word-break: break-all; }
        #loggedIn { display: none; }
        #loggedOut { display: block; }
        .hidden { display: none !important; }
        .pill { display: inline-block; background: #e8f5e9; color: #2e7d32;
            padding: 2px 8px; border-radius: 12px; font-size: 12px; }
        button.link { background: none; border: none; color: #1565c0;
            cursor: pointer; padding: 0; font-size: 14px; }
    </style>
</head>
<body>
<h1>One Enterprise Cloud — Auth Service</h1>
<p class="sub">SSO POC (backend-served frontend)</p>

<!-- Logged-out view -->
<div id="loggedOut">
    <p>Sign in with a provider:</p>
    <a class="btn" href="/api/oauth2/authorization/google">
        <img src="https://www.google.com/favicon.ico" width="16" height="16" alt="">
        Sign in with Google
    </a>
    <br><br>
    <a class="btn" href="/api/oauth2/authorization/microsoft">
        <img src="https://learn.microsoft.com/favicon.ico" width="16" height="16" alt="">
        Sign in with Microsoft
    </a>
    <br><br>
    <a class="btn" href="/api/oauth2/authorization/github">
        <img src="https://github.com/favicon.ico" width="16" height="16" alt="">
        Sign in with GitHub
    </a>
</div>

<!-- Logged-in view -->
<div id="loggedIn">
    <p>You are signed in <span class="pill">SSO</span></p>
    <div class="card">
        <div class="kv">
            <div class="k">Username</div><div class="v" id="u-username">…</div>
            <div class="k">Email</div>   <div class="v" id="u-email">…</div>
            <div class="k">Tenant</div>  <div class="v" id="u-tenant">…</div>
            <div class="k">Roles</div>   <div class="v" id="u-roles">…</div>
            <div class="k">Principal</div><div class="v" id="u-principal">…</div>
        </div>
        <button class="link" id="logout">Sign out</button>
    </div>
</div>

<script src="/api/app.js"></script>
</body>
</html>
